<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>HRM Review — Панель заказчиков</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700&family=IBM+Plex+Sans:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --font-primary: 'Montserrat', sans-serif;
    --font-secondary: 'IBM Plex Sans', sans-serif;

    --bg: #f4f4f4;
    --surface: #ffffff;
    --header-bg: #402781;

    --border: #e0e0e0;

    --text: #161616;
    --text-muted: #6f6f6f;
    --text-hint: #a8a8a8;

    --accent: #8a3ffc;
    --accent-hover: #6929c4;
    --accent-light: #e8daff;

    --radius-sm: 8px;
    --radius-md: 12px;
    --radius-lg: 16px;
    --radius-pill: 100px;
    --radius-round: 9999px;

    --card-shadow: 0 1px 3px rgba(22,22,22,0.08), 0 0 0 1px rgba(22,22,22,0.04);
  }

  body {
    font-family: var(--font-secondary);
    background: var(--bg);
    color: var(--text);
    font-size: 14px;
    line-height: 140%;
    letter-spacing: 0.01em;
    min-height: 100vh;
  }

  .layout {
    display: grid;
    grid-template-columns: 260px 1fr;
    grid-template-rows: 56px 1fr;
    height: 100vh;
    max-width: 1280px;
    margin: 0 auto;
  }

  /* ── Header ── */
  header {
    grid-column: 1 / -1;
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 0 24px;
    background: var(--header-bg);
  }

  .logo {
    font-family: var(--font-primary);
    font-size: 16px; font-weight: 700;
    letter-spacing: -0.05px; line-height: 120%;
    color: #ffffff;
  }
  .logo span { color: #be95ff; }

  .api-row { display: flex; align-items: center; gap: 8px; }
  .api-row label { font-size: 12px; color: rgba(255,255,255,0.55); }
  .mock-toggle {
    display: flex; align-items: center; gap: 8px;
    cursor: pointer;
    font-size: 12px;
    color: rgba(255,255,255,0.65) !important;
    user-select: none;
    transition: color 0.2s;
  }
  .mock-toggle:has(input:checked) { color: #be95ff !important; }
  .mock-toggle input { display: none; }

  .mock-track {
    position: relative;
    width: 32px; height: 18px; flex-shrink: 0;
    background: rgba(255,255,255,0.15);
    border-radius: 9px;
    border: 1px solid rgba(255,255,255,0.2);
    transition: background 0.2s, border-color 0.2s;
  }
  .mock-toggle:has(input:checked) .mock-track {
    background: #8a3ffc;
    border-color: #8a3ffc;
  }
  .mock-thumb {
    position: absolute;
    top: 2px; left: 2px;
    width: 12px; height: 12px;
    border-radius: 50%;
    background: rgba(255,255,255,0.6);
    transition: transform 0.2s, background 0.2s;
  }
  .mock-toggle:has(input:checked) .mock-thumb {
    transform: translateX(14px);
    background: #ffffff;
  }
  .api-row input {
    width: 240px; height: 32px; padding: 0 12px;
    border: 1px solid rgba(255,255,255,0.2);
    border-radius: var(--radius-sm);
    font-size: 12px; background: rgba(255,255,255,0.1);
    color: #ffffff; font-family: monospace;
  }
  .api-row input::placeholder { color: rgba(255,255,255,0.35); }
  .api-row input:focus { outline: none; border-color: rgba(255,255,255,0.5); background: rgba(255,255,255,0.15); }

  .api-status {
    width: 8px; height: 8px; border-radius: 50%;
    background: rgba(255,255,255,0.2); flex-shrink: 0;
  }
  .api-status.ok { background: #42be65; }

  /* ── Sidebar ── */
  aside {
    background: var(--bg);
    border-right: 1px solid var(--border);
    overflow-y: auto;
    padding: 16px;
    display: flex;
    flex-direction: column;
    gap: 20px;
  }

  .section-title {
    font-family: var(--font-primary);
    font-size: 11px; font-weight: 600;
    text-transform: uppercase; letter-spacing: 0.6px;
    line-height: 120%;
    color: var(--text-hint);
    margin-bottom: 8px;
  }

  .persona-list { display: flex; flex-direction: column; gap: 3px; }

  .persona-item {
    display: flex; align-items: center; gap: 10px;
    padding: 8px 10px; border-radius: var(--radius-sm);
    cursor: pointer;
    transition: background 0.1s;
  }
  .persona-item:hover { background: rgba(0,0,0,0.04); }
  .persona-item.selected {
    background: var(--surface);
    box-shadow: var(--card-shadow);
  }

  .p-avatar {
    width: 32px; height: 32px; border-radius: var(--radius-round);
    display: flex; align-items: center; justify-content: center;
    font-family: var(--font-primary);
    font-size: 10px; font-weight: 700; flex-shrink: 0;
  }

  .p-name { font-size: 13px; font-weight: 500; flex: 1; }

  .p-check {
    width: 16px; height: 16px; border-radius: 4px;
    border: 1.5px solid var(--border);
    background: var(--surface);
    display: flex; align-items: center; justify-content: center;
    flex-shrink: 0;
  }
  .persona-item.selected .p-check {
    background: var(--accent); border-color: var(--accent);
  }
  .persona-item.selected .p-check::after {
    content: ""; display: block;
    width: 8px; height: 5px;
    border-left: 1.5px solid white;
    border-bottom: 1.5px solid white;
    transform: rotate(-45deg) translateY(-1px);
  }

  .selected-count {
    font-size: 12px; color: var(--text-muted);
    padding: 6px 12px;
    background: var(--surface);
    border-radius: var(--radius-sm);
    box-shadow: var(--card-shadow);
    text-align: center; margin-top: 8px;
  }

  /* ── Phase buttons ── */
  .phase-grid { display: flex; flex-direction: column; gap: 4px; }
  .phase-btn {
    padding: 8px 12px; border-radius: var(--radius-sm);
    border: none; background: transparent;
    cursor: pointer; font-size: 13px; text-align: left;
    color: var(--text); font-family: var(--font-secondary);
    transition: background 0.1s;
  }
  .phase-btn:hover { background: rgba(0,0,0,0.04); }
  .phase-btn.active {
    background: var(--surface);
    box-shadow: var(--card-shadow);
    color: var(--accent);
    font-weight: 600;
  }

  /* ── Main ── */
  main {
    display: flex; flex-direction: column;
    overflow: hidden; background: var(--bg);
  }

  .chat-header {
    padding: 12px 24px;
    background: var(--surface);
    box-shadow: 0 1px 0 var(--border);
    display: flex; align-items: center; gap: 12px;
  }

  .participants { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; }

  .p-chip {
    display: flex; align-items: center; gap: 6px;
    padding: 4px 10px 4px 6px;
    border-radius: var(--radius-pill);
    font-size: 12px; font-weight: 500;
  }
  .p-chip-av {
    width: 18px; height: 18px; border-radius: var(--radius-round);
    display: flex; align-items: center; justify-content: center;
    font-size: 8px; font-weight: 700;
  }

  .phase-badge {
    font-family: var(--font-primary);
    font-size: 11px; font-weight: 600;
    padding: 4px 12px; border-radius: var(--radius-pill);
    background: var(--accent-light);
    color: var(--accent);
    text-transform: uppercase; letter-spacing: 0.4px;
    margin-left: auto;
  }

  /* ── Chat area ── */
  .chat-area {
    flex: 1; overflow-y: auto;
    padding: 24px;
    display: flex; flex-direction: column; gap: 16px;
  }

  .empty-state {
    flex: 1; display: flex; flex-direction: column;
    align-items: center; justify-content: center;
    gap: 12px; color: var(--text-hint);
    text-align: center; padding: 40px;
  }
  .empty-icon {
    width: 52px; height: 52px; border-radius: var(--radius-round);
    background: var(--surface);
    box-shadow: var(--card-shadow);
    display: flex; align-items: center; justify-content: center;
  }
  .empty-icon svg { width: 24px; height: 24px; opacity: 0.4; }
  .empty-title {
    font-family: var(--font-primary);
    font-size: 16px; font-weight: 600; line-height: 120%;
    color: var(--text-muted);
  }
  .empty-sub { font-size: 13px; max-width: 280px; }

  /* ── Messages ── */
  .msg-wrap { display: flex; gap: 12px; align-items: flex-start; }

  .msg-avatar {
    width: 36px; height: 36px; border-radius: var(--radius-round);
    display: flex; align-items: center; justify-content: center;
    font-family: var(--font-primary);
    font-size: 10px; font-weight: 700; flex-shrink: 0;
  }

  .msg-right { flex: 1; min-width: 0; }
  .msg-name {
    font-family: var(--font-primary);
    font-size: 12px; font-weight: 600; line-height: 120%;
    margin-bottom: 6px;
  }
  .msg-bubble {
    padding: 14px 16px;
    border-radius: 4px var(--radius-lg) var(--radius-lg) var(--radius-lg);
    font-size: 13px; line-height: 1.7;
    background: var(--surface);
    box-shadow: var(--card-shadow);
  }
  .msg-bubble p { margin: 0 0 8px; }
  .msg-bubble p:last-child { margin-bottom: 0; }
  .msg-bubble strong { font-weight: 600; }
  .msg-bubble ul, .msg-bubble ol { padding-left: 20px; margin: 4px 0 8px; }
  .msg-bubble li { margin-bottom: 4px; }
  .msg-bubble h1, .msg-bubble h2, .msg-bubble h3 {
    font-family: var(--font-primary); font-weight: 600;
    line-height: 120%; margin: 10px 0 6px;
  }

  .msg-user { display: flex; justify-content: flex-end; }
  .msg-user .msg-bubble {
    background: var(--accent); color: white;
    border-radius: var(--radius-lg) 4px var(--radius-lg) var(--radius-lg);
    max-width: 70%; box-shadow: none;
  }

  /* ── Typing ── */
  .typing-wrap { display: flex; gap: 12px; align-items: flex-start; }
  .typing-bubble {
    padding: 14px 16px;
    border-radius: 4px var(--radius-lg) var(--radius-lg) var(--radius-lg);
    background: var(--surface);
    box-shadow: var(--card-shadow);
    display: flex; align-items: center; gap: 4px;
  }
  .dot { width: 5px; height: 5px; border-radius: 50%; background: var(--text-hint); animation: pulse 1.2s infinite; }
  .dot:nth-child(2) { animation-delay: .2s; }
  .dot:nth-child(3) { animation-delay: .4s; }
  @keyframes pulse { 0%,80%,100%{opacity:.25;} 40%{opacity:1;} }

  /* ── Input area ── */
  .input-area {
    padding: 16px 24px;
    background: var(--surface);
    box-shadow: 0 -1px 0 var(--border);
  }

  .input-box {
    display: flex; gap: 10px; align-items: flex-end;
    padding: 10px 10px 10px 16px;
    border: 1px solid var(--border);
    border-radius: var(--radius-md);
    background: var(--surface);
    transition: border-color 0.15s, box-shadow 0.15s;
  }
  .input-box:focus-within {
    border-color: var(--accent);
    box-shadow: 0 0 0 2px rgba(138,63,252,0.12);
  }

  #doc-input {
    flex: 1; border: none; outline: none; resize: none;
    font-size: 14px; line-height: 1.6; max-height: 200px;
    background: transparent; color: var(--text);
    font-family: var(--font-secondary); min-height: 20px;
  }
  #doc-input::placeholder { color: var(--text-hint); }

  .send-btn {
    width: 36px; height: 36px;
    border-radius: var(--radius-pill);
    background: var(--accent); border: none; cursor: pointer;
    display: flex; align-items: center; justify-content: center;
    flex-shrink: 0; transition: background 0.15s;
  }
  .send-btn:hover { background: var(--accent-hover); }
  .send-btn:disabled { background: #c6c6c6; cursor: default; }
  .send-btn svg { width: 16px; height: 16px; }

  .hint {
    font-size: 11px; color: var(--text-hint);
    margin-top: 8px; text-align: center;
  }

  /* ── Divider ── */
  .divider {
    display: flex; align-items: center; gap: 12px;
    font-family: var(--font-primary);
    font-size: 11px; font-weight: 600;
    color: var(--text-hint);
    text-transform: uppercase; letter-spacing: 0.4px;
  }
  .divider::before, .divider::after {
    content: ""; flex: 1; height: 1px; background: var(--border);
  }

  /* ── Clear button ── */
  .clear-btn {
    width: 100%; padding: 8px 20px;
    border-radius: var(--radius-pill);
    font-size: 13px; font-weight: 500;
    border: 1px solid var(--border);
    background: var(--surface);
    color: var(--text-muted); cursor: pointer;
    font-family: var(--font-secondary);
    box-shadow: var(--card-shadow);
    transition: background 0.1s;
  }
  .clear-btn:hover { background: #e8e8e8; }

  ::-webkit-scrollbar { width: 4px; }
  ::-webkit-scrollbar-track { background: transparent; }
  ::-webkit-scrollbar-thumb { background: var(--border); border-radius: 4px; }
</style>
</head>
<body>

<div class="layout">
  <header>
    <div class="logo">HRM <span>Review</span></div>
    <div class="api-row">
      <label class="mock-toggle" id="mock-label">
        <input type="checkbox" id="mock-mode" onchange="toggleMock()" />
        <span class="mock-track"><span class="mock-thumb"></span></span>
        Тест без API
      </label>
      <label>Groq API key</label>
      <input type="password" id="api-key" placeholder="gsk_..." oninput="checkKey()" />
      <div class="api-status" id="api-status"></div>
    </div>
  </header>

  <aside>
    <div>
      <div class="section-title">Участники</div>
      <div class="persona-list" id="persona-list"></div>
      <div class="selected-count" id="selected-count" style="margin-top:8px;">Никто не выбран</div>
    </div>

    <div>
      <div class="section-title">Фаза проекта</div>
      <div class="phase-grid" id="phase-grid"></div>
    </div>

    <div style="margin-top:auto;">
      <button class="clear-btn" style="width:100%;" onclick="clearChat()">Очистить диалог</button>
    </div>
  </aside>

  <main>
    <div class="chat-header" id="chat-header">
      <div class="participants" id="participants-chips">
        <span style="font-size:13px;color:var(--text-hint);">Выбери участников слева</span>
      </div>
    </div>

    <div class="chat-area" id="chat-area">
      <div class="empty-state" id="empty-state">
        <div class="empty-icon">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">
            <path d="M8 12h.01M12 12h.01M16 12h.01M21 12c0 4.418-4.03 8-9 8a9.863 9.863 0 01-4.255-.949L3 20l1.395-3.72C3.512 15.042 3 13.574 3 12c0-4.418 4.03-8 9-8s9 3.582 9 8z"/>
          </svg>
        </div>
        <div class="empty-title">Обсуждение не начато</div>
        <div class="empty-sub">Выбери персон и фазу проекта, затем отправь документ или задачу</div>
      </div>
    </div>

    <div class="input-area">
      <div class="input-box">
        <textarea id="doc-input" rows="1" placeholder="Вставь документ, задачу или идею для обсуждения..." onkeydown="handleKey(event)" oninput="autoResize(this)"></textarea>
        <button class="send-btn" id="send-btn" onclick="sendMessage()" disabled>
          <svg viewBox="0 0 24 24" fill="white">
            <path d="M12 4l8 8-8 8M4 12h16" stroke="white" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
          </svg>
        </button>
      </div>
      <div class="hint">Ctrl+Enter — отправить · Ответы идут последовательно от каждой персоны</div>
    </div>
  </main>
</div>

<script>
const PERSONAS = [
  {id:"hrd_l", label:"HRD крупной", short:"ХД", bg:"#dbeafe", color:"#1e40af",
   prompt:"Ты HRD крупной компании (500+ сотрудников). Профессиональный и осторожный. Твои метрики: eNPS, текучесть в первые 6 мес., time-to-hire, % закрытия вакансий. Говоришь взвешенно, требуешь обоснований и согласований. Не лестишь."},
  {id:"hrd_s", label:"HRD небольшой", short:"ХД", bg:"#dcfce7", color:"#15803d",
   prompt:"Ты HRD небольшой компании (до 150 сотрудников). Гибкий и практичный. Сам закрываешь вакансии. Говоришь прямо, не любишь бюрократию и избыточный функционал. Не лестишь."},
  {id:"cb", label:"Специалист C&B", short:"CB", bg:"#fef9c3", color:"#854d0e",
   prompt:"Ты специалист C&B. Дотошный и точный. Работаешь с грейдами, бонусными схемами и льготами. Тебя интересует точность расчётов, исключения, интеграция с бухгалтерией. Не лестишь."},
  {id:"ceo", label:"Ген. директор", short:"ГД", bg:"#fee2e2", color:"#991b1b",
   prompt:"Ты Генеральный директор. Стратегический и краткий. Тебя интересует ROI, риски и бизнес-ценность. Не углубляешься в детали реализации. Говоришь жёстко и по делу."},
  {id:"corp", label:"Корп. университет", short:"КУ", bg:"#ede9fe", color:"#5b21b6",
   prompt:"Ты руководитель корпоративного университета. Думаешь о карьерных треках, обучении и компетенциях сотрудников. Вдумчивый и системный. Интересуешься связками HRM+обучение+оценка."},
  {id:"ciso", label:"Безопасник", short:"СБ", bg:"#fce7f3", color:"#9d174d",
   prompt:"Ты CISO/руководитель СБ. Скептичный по умолчанию. Тебя интересует разграничение доступа, персданные, соответствие 152-ФЗ, логирование действий. Конкретный и жёсткий."},
  {id:"dept", label:"Рук. подразделения", short:"РП", bg:"#d1fae5", color:"#065f46",
   prompt:"Ты руководитель бизнес-подразделения, не HR. Прагматичный и нетерпеливый. Тебя интересует удобство для нетехничного пользователя, минимум шагов, прозрачность по своей команде."},
  {id:"cfo", label:"CFO", short:"CF", bg:"#f3f4f6", color:"#374151",
   prompt:"Ты CFO. Аналитичный и точный. Тебя интересует бюджет, стоимость владения, корректность данных о ФОТ и бонусах, риски для финансовой отчётности."},
  {id:"cio", label:"CIO", short:"CI", bg:"#fce7f3", color:"#7c3aed",
   prompt:"Ты CIO/IT-директор. Системный и практичный. Тебя интересуют интеграции с 1С/AD, SSO, надёжность, SLA, кто будет администрировать систему."},
  {id:"emp", label:"Сотрудник", short:"СО", bg:"#e5e7eb", color:"#374151",
   prompt:"Ты рядовой сотрудник, конечный пользователь HRM. Честный и непосредственный. Оцениваешь через здравый смысл: понятно/непонятно, удобно/неудобно. Говоришь без корпоративного языка."},
];

const PHASES = [
  {id:"concept", label:"Концепция", desc:"стратегические вопросы о смысле"},
  {id:"req", label:"Требования", desc:"полнота и применимость"},
  {id:"ready", label:"Готовая функциональность", desc:"оценка как пользователь"},
];

let selectedPersonas = new Set();
let selectedPhase = null;
let isLoading = false;
let isMock = false;

function toggleMock() {
  isMock = document.getElementById("mock-mode").checked;
  updateSendBtn();
}

function mockResponse(persona) {
  return `**Первое впечатление**

Концепция понятна, но требует уточнения по ряду ключевых параметров, прежде чем я смогу дать однозначную оценку.

**Вопросы и возражения**

1. **Кто несёт ответственность за данные?** Не указано, кто владелец и как разграничены права доступа — это критично для ${persona.label}.
2. **Как это интегрируется с существующими процессами?** Нет описания точек интеграции с тем, что уже работает.
3. **Что происходит в нештатных ситуациях?** Не проработаны сценарии ошибок и откатов.
4. **На каком горизонте ожидается результат?** Временные рамки и метрики успеха не обозначены.

**Оценка и вывод**

Документ требует доработки — нужно доработать до следующей итерации. Готов обсуждать детали после уточнения базовых параметров.`;
}

function init() {
  const list = document.getElementById("persona-list");
  PERSONAS.forEach(p => {
    const item = document.createElement("div");
    item.className = "persona-item";
    item.id = "pi-" + p.id;
    item.onclick = () => togglePersona(p.id);
    item.innerHTML = `
      <div class="p-avatar" style="background:${p.bg};color:${p.color};">${p.short}</div>
      <div class="p-name">${p.label}</div>
      <div class="p-check" id="pc-${p.id}"></div>
    `;
    list.appendChild(item);
  });

  const phases = document.getElementById("phase-grid");
  PHASES.forEach(ph => {
    const btn = document.createElement("button");
    btn.className = "phase-btn";
    btn.id = "ph-" + ph.id;
    btn.onclick = () => selectPhase(ph.id);
    btn.innerHTML = `<strong>${ph.label}</strong><br><span style="font-size:11px;color:var(--text-hint);">${ph.desc}</span>`;
    phases.appendChild(btn);
  });
}

function togglePersona(id) {
  if (selectedPersonas.has(id)) selectedPersonas.delete(id);
  else selectedPersonas.add(id);
  document.getElementById("pi-" + id).classList.toggle("selected", selectedPersonas.has(id));
  updateCount();
  updateChips();
  updateSendBtn();
}

function selectPhase(id) {
  selectedPhase = id;
  PHASES.forEach(ph => {
    document.getElementById("ph-" + ph.id).classList.toggle("active", ph.id === id);
  });
  updateSendBtn();
}

function updateCount() {
  const n = selectedPersonas.size;
  document.getElementById("selected-count").textContent =
    n === 0 ? "Никто не выбран" : `Выбрано: ${n} из ${PERSONAS.length}`;
}

function updateChips() {
  const c = document.getElementById("participants-chips");
  c.innerHTML = "";
  if (selectedPersonas.size === 0) {
    c.innerHTML = `<span style="font-size:13px;color:var(--text-hint);">Выбери участников слева</span>`;
    return;
  }
  PERSONAS.filter(p => selectedPersonas.has(p.id)).forEach(p => {
    const chip = document.createElement("div");
    chip.className = "p-chip";
    chip.style.background = p.bg;
    chip.style.borderColor = p.bg;
    chip.innerHTML = `<div class="p-chip-av" style="background:${p.color};color:white;">${p.short}</div><span style="color:${p.color};">${p.label}</span>`;
    c.appendChild(chip);
  });

  if (selectedPhase) {
    const ph = PHASES.find(p => p.id === selectedPhase);
    const badge = document.createElement("div");
    badge.className = "phase-badge";
    badge.textContent = ph.label;
    c.appendChild(badge);
  }
}

function updateSendBtn() {
  const btn = document.getElementById("send-btn");
  const hasKey = isMock || document.getElementById("api-key").value.trim().length > 10;
  btn.disabled = selectedPersonas.size === 0 || !selectedPhase || isLoading || !hasKey;
}

function checkKey() {
  const val = document.getElementById("api-key").value.trim();
  const st = document.getElementById("api-status");
  st.classList.toggle("ok", val.length > 10);
  if (val.length > 10) localStorage.setItem("groq_key", val);
  updateSendBtn();
}

function handleKey(e) {
  if (e.key === "Enter" && e.ctrlKey) { e.preventDefault(); sendMessage(); }
}

function autoResize(el) {
  el.style.height = "auto";
  el.style.height = Math.min(el.scrollHeight, 200) + "px";
  updateSendBtn();
}

function clearChat() {
  const area = document.getElementById("chat-area");
  area.innerHTML = `<div class="empty-state" id="empty-state">
    <div class="empty-icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M8 12h.01M12 12h.01M16 12h.01M21 12c0 4.418-4.03 8-9 8a9.863 9.863 0 01-4.255-.949L3 20l1.395-3.72C3.512 15.042 3 13.574 3 12c0-4.418 4.03-8 9-8s9 3.582 9 8z"/></svg></div>
    <div class="empty-title">Обсуждение не начато</div>
    <div class="empty-sub">Выбери персон и фазу проекта, затем отправь документ или задачу</div>
  </div>`;
}

function addUserMsg(text) {
  const empty = document.getElementById("empty-state");
  if (empty) empty.remove();
  const area = document.getElementById("chat-area");
  const wrap = document.createElement("div");
  wrap.className = "msg-user";
  wrap.innerHTML = `<div class="msg-bubble">${escHtml(text)}</div>`;
  area.appendChild(wrap);
  area.scrollTop = area.scrollHeight;
}

function addDivider(text) {
  const area = document.getElementById("chat-area");
  const d = document.createElement("div");
  d.className = "divider";
  d.textContent = text;
  area.appendChild(d);
  area.scrollTop = area.scrollHeight;
}

function addTyping(persona) {
  const area = document.getElementById("chat-area");
  const wrap = document.createElement("div");
  wrap.className = "typing-wrap";
  wrap.id = "typing-" + persona.id;
  wrap.innerHTML = `
    <div class="msg-avatar" style="background:${persona.bg};color:${persona.color};">${persona.short}</div>
    <div>
      <div class="msg-name" style="color:${persona.color};">${persona.label}</div>
      <div class="typing-bubble" style="background:${persona.bg};border-color:${persona.bg};">
        <div class="dot"></div><div class="dot"></div><div class="dot"></div>
      </div>
    </div>`;
  area.appendChild(wrap);
  area.scrollTop = area.scrollHeight;
  return wrap;
}

function addPersonaMsg(persona, text) {
  const area = document.getElementById("chat-area");
  const wrap = document.createElement("div");
  wrap.className = "msg-wrap";
  const bubble = document.createElement("div");
  bubble.className = "msg-bubble";
  bubble.style.background = persona.bg;
  bubble.innerHTML = marked.parse(text);
  const nameEl = document.createElement("div");
  nameEl.className = "msg-name";
  nameEl.style.color = persona.color;
  nameEl.textContent = persona.label;
  const right = document.createElement("div");
  right.className = "msg-right";
  right.appendChild(nameEl);
  right.appendChild(bubble);
  const avatar = document.createElement("div");
  avatar.className = "msg-avatar";
  avatar.style.background = persona.bg;
  avatar.style.color = persona.color;
  avatar.textContent = persona.short;
  wrap.appendChild(avatar);
  wrap.appendChild(right);
  area.appendChild(wrap);
  area.scrollTop = area.scrollHeight;
}

function escHtml(text) {
  return text.replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");
}

async function callDeepSeek(systemPrompt, userMessage) {
  const key = document.getElementById("api-key").value.trim();
  const res = await fetch("/api/chat", {
    method: "POST",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify({
      apiKey: key,
      model: "llama-3.1-8b-instant",
      messages: [
        { role: "system", content: systemPrompt },
        { role: "user", content: userMessage }
      ],
      max_tokens: 1000,
      temperature: 0.7
    })
  });
  const data = await res.json();
  if (!res.ok) {
    const msg = data?.error?.message || data?.error || JSON.stringify(data);
    throw new Error(`HTTP ${res.status}: ${msg}`);
  }
  return data.choices?.[0]?.message?.content || "Нет ответа";
}

async function sendMessage() {
  const input = document.getElementById("doc-input");
  const text = input.value.trim();
  if (!text || isLoading) return;
  if (selectedPersonas.size === 0) { alert("Выбери хотя бы одну персону"); return; }
  if (!selectedPhase) { alert("Выбери фазу проекта"); return; }

  isLoading = true;
  updateSendBtn();
  input.value = "";
  input.style.height = "auto";

  const phaseLabel = PHASES.find(p => p.id === selectedPhase).label.toUpperCase();
  addUserMsg(text);
  addDivider("Обсуждение · " + phaseLabel);

  const userPrompt = `ФАЗА: ${phaseLabel}\n\n${text}\n\nДай обратную связь в 3 блоках:\n1. Первое впечатление (1-2 предложения)\n2. Вопросы и возражения (минимум 3 конкретных пункта)\n3. Оценка полноты и вывод\n\nОтвечай строго от своей роли, кратко и по делу. Не используй слова: промпт, LLM, агент, нейросеть.`;

  const active = PERSONAS.filter(p => selectedPersonas.has(p.id));
  for (const persona of active) {
    const typing = addTyping(persona);
    try {
      let reply;
      if (isMock) {
        await new Promise(r => setTimeout(r, 800 + Math.random() * 600));
        reply = mockResponse(persona);
      } else {
        reply = await callDeepSeek(persona.prompt, userPrompt);
      }
      document.getElementById("chat-area").removeChild(typing);
      addPersonaMsg(persona, reply);
    } catch (e) {
      document.getElementById("chat-area").removeChild(typing);
      addPersonaMsg(persona, "⚠ Ошибка: " + e.message);
    }
  }

  isLoading = false;
  updateSendBtn();
}

const savedKey = localStorage.getItem("groq_key");
if (savedKey) {
  document.getElementById("api-key").value = savedKey;
  checkKey();
}
init();
</script>

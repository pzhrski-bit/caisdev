name: Build & Deploy

on:
  push:
    branches: [main, feature/session-resume-logout]

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v4

      - name: Log in to ghcr.io
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Determine image tag
        id: vars
        run: |
          if [ "${{ github.ref_name }}" = "main" ]; then
            echo "tag=latest" >> "$GITHUB_OUTPUT"
          else
            echo "tag=branch-preview" >> "$GITHUB_OUTPUT"
          fi

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ghcr.io/pzhrski-bit/caisdev:${{ steps.vars.outputs.tag }}

  deploy:
    needs: build
    runs-on: ubuntu-latest
    if: github.ref_name == 'main'

    steps:
      - name: Deploy to VPS
        env:
          VPS_PASSWORD: ${{ secrets.VPS_PASSWORD }}
          VPS_USER: ${{ secrets.VPS_USER }}
          VPS_HOST: ${{ secrets.VPS_HOST }}
        run: |
          sudo apt-get install -y sshpass
          sshpass -p "$VPS_PASSWORD" ssh \
            -o StrictHostKeyChecking=no \
            -o PreferredAuthentications=password \
            -o PubkeyAuthentication=no \
            "$VPS_USER@$VPS_HOST" bash -s <<'REMOTE'
          docker pull ghcr.io/pzhrski-bit/caisdev:latest
          docker stop caisdev || true
          docker rm caisdev || true
          docker run -d --name caisdev --restart unless-stopped \
            --env-file /root/.env \
            -p 80:3000 \
            ghcr.io/pzhrski-bit/caisdev:latest
          docker ps --filter name=caisdev --format "{{.Names}} {{.Status}}"
          REMOTE
